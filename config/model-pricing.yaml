# Official OpenAI API pricing catalog.
#
# Unit: USD per 1,000,000 tokens. Keep this file as the single maintenance
# point when OpenAI adds a model or changes a public API price.
# Source: https://platform.openai.com/docs/pricing.md
# Last verified: 2026-11-03
#
# These values estimate the equivalent API cost of proxy traffic. They are
# not the account balance or quota returned by chatgpt.com.
#
# Entries below follow the models currently served by the official API.
# `gpt-6-astra-aeon` and `gpt-reserve` are kept because they remain in the
# local static model catalog even though the upstream catalog no longer lists
# them.

