api:
  base_url: https://chatgpt.com/backend-api
  timeout_seconds: 600
client:
  profile: codex_cli
  originator: codex_cli_rs
  app_version: 26.1007.41230
  build_number: "20324"
  platform: darwin
  arch: arm64
  chromium_version: "146"

model:
  default: gpt-5.6-sol
  # Codex host model for POST /v1/images/generations. The client-facing
  # gpt-image-2 identifier only means "generate an image" — it is never
  # sent upstream as the chat model itself.
  image_host_model: gpt-5.5
  default_reasoning_effort: null
  default_service_tier: null
  # Optional forced service tier per OAuth model, overriding client preferences.
  service_tier_overrides: {}
  default_tools: []
  aliases: {}
  custom_models: []
  inject_desktop_context: false
  suppress_desktop_directives: false
  allow_client_system_prompt_strategy: false
  # How user-supplied system prompt is delivered to the Codex backend:
  #   instructions     - default; user system goes into the top-level `instructions` field
  #   developer_inline - user system is moved to input[0] as a developer-role message
  #   system_inline    - user system is moved to input[0] as a system-role message
  # The two `_inline` modes can bypass Codex backend's built-in base prompt prior
  # in cases where the `instructions` field is overridden by server-injected context.
  system_prompt_strategy: instructions
auth:
  jwt_token: null
  chatgpt_oauth: true
  refresh_enabled: true
  refresh_margin_seconds: 300
  rotation_strategy: least_used
  # Hard account restrictions keyed by effective service_tier; see README_EN.md.
  service_tier_routing: {}
  rate_limit_backoff_seconds: 60
  oauth_client_id: app_EMoamEEZ73f0CkXaXp7hrann
  oauth_auth_endpoint: https://auth.openai.com/oauth/authorize
  oauth_token_endpoint: https://auth.openai.com/oauth/token
server:
  host: 127.0.0.1
  port: 8080
  proxy_api_key: null
  trust_proxy: false
  cors_allow_null_origin: false
logs:
  enabled: false
  capacity: 2000
  capture_body: false
  llm_only: true
usage_stats:
  snapshot_interval_minutes: 5
  history_retention_days: null
session:
  ttl_minutes: 60
  cleanup_interval_minutes: 5
tls:
  transport: native
  proxy_url: null
  force_http11: false
  # Upstream streaming no-progress watchdog (ms). Surfaces half-open
  # connections as premature stream closes instead of hanging forever.
  # Covers both phases: waiting for response headers (pre-header hang) and
  # gaps between body bytes (clock starts at the first body byte, so
  # pre-first-token thinking pauses are never cut). 0 disables.
  stream_idle_timeout_ms: 120000
quota:
  refresh_interval_minutes: 0
  concurrency: 10
  warning_thresholds:
    primary:
      - 80
      - 90
    secondary:
      - 80
      - 90
  skip_exhausted: true
# Refuse to resend a conversation the upstream safety gate already rejected.
# Such a rejection is a function of the content, so a retry cannot succeed: it
# only reports another violation, which is what escalates to an account ban.
# Disabled by default. See src/proxy/policy-rejection.ts.
policy_guard:
  enabled: false
  # Structured error.code values identifying a policy rejection.
  error_codes:
    - cyber_policy
    - session_blocked_by_cyber_policy
  # Substring fallbacks for deployments that strip the code. Matched against
  # upstream error output only — never against request content.
  message_patterns:
    - possible cybersecurity risk
    - high-risk cyber activity
    - cyber-security policy
    - 网络安全策略屏蔽
  # Optional narrowing filter. When non-empty, only these HTTP statuses can be
  # treated as a policy rejection; empty means no restriction. A status never
  # triggers the guard on its own (403 also means ban, 429 also means rate
  # limit), so this can only make the guard stricter. Ignored for stream
  # terminal frames, which carry no HTTP status.
  status_codes: []
  # Quarantine lifetime in seconds; edited history releases it sooner.
  ttl_seconds: 3600
update:
  auto_update: true
  show_update_dialog: false
  allow_prerelease: false
ollama:
  enabled: false
  host: 127.0.0.1
  port: 11434
  version: 0.18.3
  disable_vision: false
official_agent:
  enabled: false
  api_key: null
  app_server_url: ws://127.0.0.1:4500
  request_timeout_ms: 30000
  auth:
    type: none
