name: Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag to publish as a version image (e.g. v2.0.73). Omit for latest-only."
        required: false
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version images must be built from the tagged source, not whatever
          # master currently points at. Branch pushes (e.g. the 14:00 UTC
          # promote) only refresh `latest` + a sha tag — the old behavior
          # ("max(package.json, latest stable tag)") rebuilt vX.Y.Z from
          # newer-than-tag code and silently clobbered the version image.
          ref: ${{ inputs.tag || github.ref }}
          # Full history + tags: the version step reads stable tags to pick
          # PROXY_VERSION on branch pushes (package.json patch is stale by
          # design under the tag-only release scheme).
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image tags
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          # Dispatch inputs are arbitrary strings; refuse anything that is not
          # a plain semver tag. bash [[ =~ ]] anchors the WHOLE string (grep
          # would match per-line and let a multiline payload through into the
          # GITHUB_OUTPUT heredoc below).
          if [ -n "$TAG_INPUT" ] && ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid tag input"
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          # Re-tagging `latest` is only safe when we're building the current
          # master tip. A manual dispatch of an OLD tag (re-publishing a
          # version image) must not silently move `latest` backwards.
          PUSH_LATEST=true
          if [ -n "$TAG_INPUT" ]; then
            git fetch origin master --depth=1 >/dev/null 2>&1 || true
            MASTER_SHA=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
            if [ "$(git rev-parse HEAD)" != "$MASTER_SHA" ]; then
              echo "tag $TAG_INPUT is not the master tip, skipping latest"
              PUSH_LATEST=false
            fi
          fi

          {
            echo "tags<<EOF"
            if [ "$PUSH_LATEST" = "true" ]; then
              echo "type=raw,value=latest"
            fi
            echo "type=raw,value=sha-${SHORT_SHA}"
          if [ -n "$TAG_INPUT" ]; then
            echo "type=raw,value=${TAG_INPUT}"
          fi
          echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # PROXY_VERSION baked into the image (ENV consumed by
          # getProxyInfo() — containers have no .git, so without this they
          # fall back to the stale package.json version). Tag dispatches
          # report the tag itself; branch pushes report the higher of
          # package.json and the newest stable tag.
          if [ -n "$TAG_INPUT" ]; then
            echo "version=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            LATEST_STABLE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || echo "0.0.0")
            FINAL=$(node -e "
              const cmp = (x, y) => {
                const pa = x.split('.').map(Number);
                const pb = y.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  if (pa[i] !== pb[i]) return pa[i] - pb[i];
                }
                return 0;
              };
              console.log(cmp('$PKG_VERSION', '$LATEST_STABLE') >= 0 ? '$PKG_VERSION' : '$LATEST_STABLE');
            ")
            echo "version=$FINAL" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.version.outputs.tags }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PROXY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Lite image: arm64 musl addon ──────────────────────────────────
  # Built natively in an Alpine container on an arm64 runner — the same
  # no-cross-compile rule as #805: cross-building musl from a glibc host
  # links C dependencies (aws-lc) against glibc and produces hybrid binaries
  # that crash inside the Alpine image. publish-lite downloads the artifact
  # and stages it into the dual-platform image context.
  addon-musl-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Cache musl cargo build
        uses: actions/cache@v4
        with:
          path: native/target
          key: musl-aarch64-unknown-linux-musl-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: musl-aarch64-unknown-linux-musl-

      - name: Build Linux arm64 musl native addon in Alpine
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/native:/build" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -w /build \
            ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine \
            sh -lc 'set -eu; apk add --no-cache build-base linux-headers; rustup toolchain install 1.88.0 --profile minimal --no-self-update; rustup target add aarch64-unknown-linux-musl --toolchain 1.88.0; export RUSTUP_TOOLCHAIN=1.88.0; export CC_aarch64_unknown_linux_musl=gcc; export CXX_aarch64_unknown_linux_musl=g++; export AWS_LC_SYS_CC_aarch64_unknown_linux_musl=gcc; export AWS_LC_SYS_CXX_aarch64_unknown_linux_musl=g++; export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=gcc; export RUSTFLAGS="-C link-arg=-static-libgcc"; npm ci --include=dev --ignore-scripts --no-audit --no-fund; npm run build:linux-arm64-musl; node /scripts/native/test-linux-x64-musl.mjs /build/codex-tls.linux-arm64-musl.node'

      - name: Verify arm64 musl addon is not glibc-linked
        run: |
          addon="native/codex-tls.linux-arm64-musl.node"
          test -f "$addon"
          # ld-linux-<anything> is the glibc dynamic loader on every arch, and
          # libc.so.6 is glibc libc: either NEEDED entry is the #805 hybrid
          # signature. A musl-linked binary carries neither.
          if readelf -d "$addon" | grep -Eq 'libc\.so\.6|ld-linux-'; then
            echo "::error::musl addon unexpectedly depends on glibc"
            exit 1
          fi
          # GLIBC_ version records attached to libgcc_s.so.1 are inert on
          # musl (its loader ignores GNU symbol versioning and binds by
          # name — the dlopen smoke above proves the addon works), but the
          # same records on any other file mean glibc contamination.
          OFFENDERS=$(readelf --version-info "$addon" 2>/dev/null | awk '
            $4 == "File:" { file = $5 }
            $3 ~ /^GLIBC_[0-9]/ && file != "" { print file }
          ' | sort -u | grep -v '^libgcc_s\.so\.1$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::GLIBC version requirements outside libgcc_s: $OFFENDERS"
            exit 1
          fi

      - name: Upload arm64 musl addon artifact
        uses: actions/upload-artifact@v4
        with:
          name: lite-native-linux-arm64-musl
          path: native/codex-tls.linux-arm64-musl.node
          if-no-files-found: error
          retention-days: 3

  # ── Lite image ─────────────────────────────────────────────────────
  # Alpine + the No-Node Lite bundle + prebuilt Linux native addons.
  # No node_modules, no toolchain, no Rust build: ~60 MB instead of ~450 MB.
  # Separate tags (:latest-lite / :sha-*-lite / version-lite) so the full
  # image remains the default.
  publish-lite:
    needs: addon-musl-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image tags
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ] && ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid tag input"
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          PUSH_LATEST=true
          if [ -n "$TAG_INPUT" ]; then
            git fetch origin master --depth=1 >/dev/null 2>&1 || true
            MASTER_SHA=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
            if [ "$(git rev-parse HEAD)" != "$MASTER_SHA" ]; then
              echo "tag $TAG_INPUT is not the master tip, skipping latest-lite"
              PUSH_LATEST=false
            fi
          fi

          {
            echo "tags<<EOF"
            if [ "$PUSH_LATEST" = "true" ]; then
              echo "type=raw,value=latest-lite"
            fi
            echo "type=raw,value=sha-${SHORT_SHA}-lite"
            if [ -n "$TAG_INPUT" ]; then
              echo "type=raw,value=${TAG_INPUT}-lite"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$TAG_INPUT" ]; then
            echo "version=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            LATEST_STABLE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || echo "0.0.0")
            FINAL=$(node -e "
              const cmp = (x, y) => {
                const pa = x.split('.').map(Number);
                const pb = y.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  if (pa[i] !== pb[i]) return pa[i] - pb[i];
                }
                return 0;
              };
              console.log(cmp('$PKG_VERSION', '$LATEST_STABLE') >= 0 ? '$PKG_VERSION' : '$LATEST_STABLE');
            ")
            echo "version=$FINAL" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build core and Lite server bundle
        run: |
          npm ci
          cd web && npm ci && cd ..
          npm run build:web
          npm --prefix packages/electron run build

      - name: Stage the Lite package tree
        run: |
          node scripts/portable/build-portable.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --out "$RUNNER_TEMP/lite"
          mkdir -p "$RUNNER_TEMP/lite-pkg"
          python3 - "$RUNNER_TEMP"/lite/*.zip "$RUNNER_TEMP/lite-pkg" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY

      - name: Cache musl cargo build
        uses: actions/cache@v4
        with:
          path: native/target
          key: musl-x86_64-unknown-linux-musl-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: musl-x86_64-unknown-linux-musl-

      - name: Build musl native addon in Alpine
        run: |
          # The musl addon must be linked against musl. Cross-building with
          # the musl target on the glibc runner links C dependencies (aws-lc)
          # against glibc, producing a hybrid binary that crashes in the
          # Alpine image with "ld-linux-x86-64.so.2 not found" (#805). Build
          # inside the same Alpine container the Lite release workflows use.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/native:/build" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -w /build \
            ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine \
            sh -lc 'set -eu; apk add --no-cache build-base linux-headers; rustup toolchain install 1.88.0 --profile minimal --no-self-update; rustup target add x86_64-unknown-linux-musl --toolchain 1.88.0; export RUSTUP_TOOLCHAIN=1.88.0; export CC_x86_64_unknown_linux_musl=gcc; export CXX_x86_64_unknown_linux_musl=g++; export AWS_LC_SYS_CC_x86_64_unknown_linux_musl=gcc; export AWS_LC_SYS_CXX_x86_64_unknown_linux_musl=g++; export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=gcc; export RUSTFLAGS="-C link-arg=-static-libgcc"; npm ci --include=dev --ignore-scripts --no-audit --no-fund; npm run build:linux-x64-musl; node /scripts/native/test-linux-x64-musl.mjs /build/codex-tls.linux-x64-musl.node'

      - name: Verify musl addon is not glibc-linked
        run: |
          addon="native/codex-tls.linux-x64-musl.node"
          file "$addon"
          # ld-linux-<anything> is the glibc dynamic loader on every arch, and
          # libc.so.6 is glibc libc: either NEEDED entry is the #805 hybrid
          # signature. A musl-linked binary carries neither.
          if readelf -d "$addon" | grep -Eq 'libc\.so\.6|ld-linux-'; then
            echo "::error::musl addon unexpectedly depends on glibc"
            exit 1
          fi
          # GLIBC_ version records attached to libgcc_s.so.1 are inert on
          # musl (its loader ignores GNU symbol versioning and binds by
          # name — the dlopen smoke above proves the addon works), but the
          # same records on any other file mean glibc contamination.
          OFFENDERS=$(readelf --version-info "$addon" 2>/dev/null | awk '
            $4 == "File:" { file = $5 }
            $3 ~ /^GLIBC_[0-9]/ && file != "" { print file }
          ' | sort -u | grep -v '^libgcc_s\.so\.1$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "::error::GLIBC version requirements outside libgcc_s: $OFFENDERS"
            exit 1
          fi

      - name: Download arm64 musl addon
        uses: actions/download-artifact@v4
        with:
          name: lite-native-linux-arm64-musl
          path: native

      - name: Stage the lite Docker context
        run: |
          node scripts/docker/stage-lite.mjs \
            --out "$RUNNER_TEMP/docker-lite-stage" \
            --package "$RUNNER_TEMP/lite-pkg" \
            --native native

      - name: Smoke test the staged bundle in Alpine
        run: |
          # The staged tree must start the server with nothing but its own
          # files (no node_modules, sqlite via the node:sqlite builtin). Run
          # it in the same node:22-alpine base the image uses, with the musl
          # addon — this replaces the old glibc-runner smoke that existed only
          # to avoid building the addon a second time (see the removed gnu
          # build step in git history).
          STAGE="$RUNNER_TEMP/docker-lite-stage"
          # Pull the base image first: an implicit pull inside `docker run -d`
          # delays container start by the pull duration and races the health
          # poll below (first run after a runner image update pulls ~30s).
          docker pull node:22-alpine >/dev/null
          # CODEX_PROXY_HOST=0.0.0.0 matches the image ENV: without it the
          # server binds 127.0.0.1 inside the container and the published
          # port never answers.
          docker run -d --rm --name "lite-staged-smoke-${{ github.run_id }}-${{ github.run_attempt }}" \
            -p 18080:8080 -e CODEX_PROXY_HOST=0.0.0.0 \
            -v "$STAGE:/app" -w /app node:22-alpine \
            node app/server.mjs --portable --mode=server --port 8080
          CNAME="lite-staged-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() { docker rm -f "$CNAME" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for i in $(seq 1 60); do
            if curl --noproxy '*' --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              echo "staged bundle is healthy under alpine node"
              exit 0
            fi
            sleep 1
          done
          echo "staged bundle did not become healthy"
          docker logs "$CNAME"
          exit 1

      - name: Assert no glibc addon reaches the image context
        run: |
          test ! -e "$RUNNER_TEMP/docker-lite-stage/native/codex-tls.linux-x64-gnu.node"
          ls -1 "$RUNNER_TEMP/docker-lite-stage/native/"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.version.outputs.tags }}

      - name: Copy Dockerfile.lite into the staged context
        run: cp Dockerfile.lite "$RUNNER_TEMP/docker-lite-stage/Dockerfile"

      - name: Build lite images for local smoke test
        run: |
          # One image per platform, loaded into the local daemon. The arm64
          # build runs its (COPY-only) steps under QEMU. Layers land in the
          # gha cache so the final dual-platform push below is near-instant.
          STAGE="$RUNNER_TEMP/docker-lite-stage"
          for ARCH in amd64 arm64; do
            docker buildx build \
              --platform "linux/$ARCH" \
              --build-arg PROXY_VERSION="${{ steps.version.outputs.version }}" \
              --cache-from type=gha,scope=lite \
              --cache-to type=gha,mode=max,scope=lite \
              --load -t "codex-proxy-lite:smoke-$ARCH" \
              -f "$STAGE/Dockerfile" "$STAGE"
          done

      - name: Smoke test the built lite images
        run: |
          # Test the built images before pushing. The host smoke test above
          # runs the staged tree, but only the real image proves the pruned
          # native/ dir + entrypoint wiring work on each architecture — that
          # gap shipped the #805 crash. The arm64 image runs under QEMU, so
          # its health poll gets a longer budget.
          for ENTRY in "amd64 codex-tls.linux-x64-musl.node 30" "arm64 codex-tls.linux-arm64-musl.node 90"; do
            set -- $ENTRY
            ARCH="$1"; ADDON="$2"; BUDGET="$3"
            IMAGE="codex-proxy-lite:smoke-$ARCH"
            if [ "$ARCH" = amd64 ]; then OTHER="codex-tls.linux-arm64-musl.node"; else OTHER="codex-tls.linux-x64-musl.node"; fi
            echo "::group::lite image smoke ($ARCH)"
            # 1. The musl addon must dlopen under the image's own Node, and
            #    the other architecture's addon must have been pruned by the
            #    Dockerfile's TARGETARCH case.
            docker run --rm --platform "linux/$ARCH" "$IMAGE" node -e \
              "const fs = require('fs'); if (fs.existsSync('/app/native/$OTHER')) throw new Error('wrong-arch addon in image: $OTHER'); require('/app/native/$ADDON'); console.log('$ADDON loads under alpine node ($ARCH)')"
            # 2. Fresh named volumes: entrypoint must seed defaults, server
            #    must start healthy inside the real image.
            SUFFIX="${{ github.run_id }}-${{ github.run_attempt }}"
            SMOKE_CFG="lite-smoke-cfg-$ARCH-$SUFFIX"
            SMOKE_DATA="lite-smoke-data-$ARCH-$SUFFIX"
            docker volume create "$SMOKE_CFG" >/dev/null
            docker volume create "$SMOKE_DATA" >/dev/null
            cid=$(docker run -d --platform "linux/$ARCH" -p 18080:8080 \
              -v "$SMOKE_CFG":/app/config \
              -v "$SMOKE_DATA":/app/data \
              "$IMAGE")
            cleanup() {
              docker rm -f "$cid" >/dev/null 2>&1 || true
              docker volume rm "$SMOKE_CFG" "$SMOKE_DATA" >/dev/null 2>&1 || true
            }
            trap cleanup EXIT
            OK=""
            for i in $(seq 1 "$BUDGET"); do
              if curl --noproxy '*' --fail --silent http://127.0.0.1:18080/health >/dev/null; then
                OK=1
                break
              fi
              sleep 1
            done
            if [ -z "$OK" ]; then
              echo "built lite image did not become healthy ($ARCH)"
              docker logs "$cid"
              exit 1
            fi
            echo "built lite image is healthy ($ARCH)"
            docker logs "$cid" 2>/dev/null | grep -E "Using native \(rustls\)|API key pool" || true
            trap - EXIT
            cleanup
            echo "::endgroup::"
          done

      - name: Push lite image to registry
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/docker-lite-stage
          file: ${{ runner.temp }}/docker-lite-stage/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PROXY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=lite

