name: Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag to publish as a version image (e.g. v2.0.73). Omit for latest-only."
        required: false
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version images must be built from the tagged source, not whatever
          # master currently points at. Branch pushes (e.g. the 14:00 UTC
          # promote) only refresh `latest` + a sha tag — the old behavior
          # ("max(package.json, latest stable tag)") rebuilt vX.Y.Z from
          # newer-than-tag code and silently clobbered the version image.
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve image tags
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          {
            echo "tags<<EOF"
            echo "type=raw,value=latest"
            echo "type=raw,value=sha-${SHORT_SHA}"
            if [ -n "${{ inputs.tag }}" ]; then
              echo "type=raw,value=${{ inputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.version.outputs.tags }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
