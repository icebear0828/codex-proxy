name: Publish Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Stable tag to publish as a version image (e.g. v2.0.73). Omit for latest-only."
        required: false
        type: string

concurrency:
  group: docker-publish
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version images must be built from the tagged source, not whatever
          # master currently points at. Branch pushes (e.g. the 14:00 UTC
          # promote) only refresh `latest` + a sha tag — the old behavior
          # ("max(package.json, latest stable tag)") rebuilt vX.Y.Z from
          # newer-than-tag code and silently clobbered the version image.
          ref: ${{ inputs.tag || github.ref }}
          # Full history + tags: the version step reads stable tags to pick
          # PROXY_VERSION on branch pushes (package.json patch is stale by
          # design under the tag-only release scheme).
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image tags
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          # Dispatch inputs are arbitrary strings; refuse anything that is not
          # a plain semver tag. bash [[ =~ ]] anchors the WHOLE string (grep
          # would match per-line and let a multiline payload through into the
          # GITHUB_OUTPUT heredoc below).
          if [ -n "$TAG_INPUT" ] && ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid tag input"
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          # Re-tagging `latest` is only safe when we're building the current
          # master tip. A manual dispatch of an OLD tag (re-publishing a
          # version image) must not silently move `latest` backwards.
          PUSH_LATEST=true
          if [ -n "$TAG_INPUT" ]; then
            git fetch origin master --depth=1 >/dev/null 2>&1 || true
            MASTER_SHA=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
            if [ "$(git rev-parse HEAD)" != "$MASTER_SHA" ]; then
              echo "tag $TAG_INPUT is not the master tip, skipping latest"
              PUSH_LATEST=false
            fi
          fi

          {
            echo "tags<<EOF"
            if [ "$PUSH_LATEST" = "true" ]; then
              echo "type=raw,value=latest"
            fi
            echo "type=raw,value=sha-${SHORT_SHA}"
          if [ -n "$TAG_INPUT" ]; then
            echo "type=raw,value=${TAG_INPUT}"
          fi
          echo "EOF"
          } >> "$GITHUB_OUTPUT"

          # PROXY_VERSION baked into the image (ENV consumed by
          # getProxyInfo() — containers have no .git, so without this they
          # fall back to the stale package.json version). Tag dispatches
          # report the tag itself; branch pushes report the higher of
          # package.json and the newest stable tag.
          if [ -n "$TAG_INPUT" ]; then
            echo "version=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            LATEST_STABLE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || echo "0.0.0")
            FINAL=$(node -e "
              const cmp = (x, y) => {
                const pa = x.split('.').map(Number);
                const pb = y.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  if (pa[i] !== pb[i]) return pa[i] - pb[i];
                }
                return 0;
              };
              console.log(cmp('$PKG_VERSION', '$LATEST_STABLE') >= 0 ? '$PKG_VERSION' : '$LATEST_STABLE');
            ")
            echo "version=$FINAL" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.version.outputs.tags }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PROXY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Lite image ─────────────────────────────────────────────────────
  # Alpine + the No-Node Lite bundle + prebuilt Linux native addons.
  # No node_modules, no toolchain, no Rust build: ~60 MB instead of ~450 MB.
  # Separate tags (:latest-lite / :sha-*-lite / version-lite) so the full
  # image remains the default.
  publish-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve image tags
        id: version
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG_INPUT" ] && ! [[ "$TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::invalid tag input"
            exit 1
          fi

          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          PUSH_LATEST=true
          if [ -n "$TAG_INPUT" ]; then
            git fetch origin master --depth=1 >/dev/null 2>&1 || true
            MASTER_SHA=$(git rev-parse FETCH_HEAD 2>/dev/null || echo "")
            if [ "$(git rev-parse HEAD)" != "$MASTER_SHA" ]; then
              echo "tag $TAG_INPUT is not the master tip, skipping latest-lite"
              PUSH_LATEST=false
            fi
          fi

          {
            echo "tags<<EOF"
            if [ "$PUSH_LATEST" = "true" ]; then
              echo "type=raw,value=latest-lite"
            fi
            echo "type=raw,value=sha-${SHORT_SHA}-lite"
            if [ -n "$TAG_INPUT" ]; then
              echo "type=raw,value=${TAG_INPUT}-lite"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$TAG_INPUT" ]; then
            echo "version=${TAG_INPUT#v}" >> "$GITHUB_OUTPUT"
          else
            PKG_VERSION=$(node -p "require('./package.json').version")
            LATEST_STABLE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 | sed 's/^v//' || echo "0.0.0")
            FINAL=$(node -e "
              const cmp = (x, y) => {
                const pa = x.split('.').map(Number);
                const pb = y.split('.').map(Number);
                for (let i = 0; i < 3; i++) {
                  if (pa[i] !== pb[i]) return pa[i] - pb[i];
                }
                return 0;
              };
              console.log(cmp('$PKG_VERSION', '$LATEST_STABLE') >= 0 ? '$PKG_VERSION' : '$LATEST_STABLE');
            ")
            echo "version=$FINAL" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build core and Lite server bundle
        run: |
          npm ci
          cd web && npm ci && cd ..
          npm run build:web
          npm --prefix packages/electron run build

      - name: Stage the Lite package tree
        run: |
          node scripts/portable/build-portable.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --out "$RUNNER_TEMP/lite"
          mkdir -p "$RUNNER_TEMP/lite-pkg"
          python3 - "$RUNNER_TEMP"/lite/*.zip "$RUNNER_TEMP/lite-pkg" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              archive.extractall(sys.argv[2])
          PY

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build musl native addon in Alpine
        run: |
          # The musl addon must be linked against musl. Cross-building with
          # the musl target on the glibc runner links C dependencies (aws-lc)
          # against glibc, producing a hybrid binary that crashes in the
          # Alpine image with "ld-linux-x86-64.so.2 not found" (#805). Build
          # inside the same Alpine container the Lite release workflows use.
          docker run --rm \
            -v "$GITHUB_WORKSPACE/native:/build" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -w /build \
            ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine \
            sh -lc 'set -eu; apk add --no-cache build-base linux-headers; rustup toolchain install 1.88.0 --profile minimal --no-self-update; rustup target add x86_64-unknown-linux-musl --toolchain 1.88.0; export RUSTUP_TOOLCHAIN=1.88.0; export CC_x86_64_unknown_linux_musl=gcc; export CXX_x86_64_unknown_linux_musl=g++; export AWS_LC_SYS_CC_x86_64_unknown_linux_musl=gcc; export AWS_LC_SYS_CXX_x86_64_unknown_linux_musl=g++; npm ci --include=dev --ignore-scripts --no-audit --no-fund; npm run build:linux-x64-musl; node /scripts/native/test-linux-x64-musl.mjs /build/codex-tls.linux-x64-musl.node'

      - name: Verify musl addon is not glibc-linked
        run: |
          addon="native/codex-tls.linux-x64-musl.node"
          file "$addon"
          if readelf -d "$addon" | grep -Eq 'libc\.so\.6|ld-linux-x86-64\.so\.2'; then
            echo "::error::musl addon unexpectedly depends on glibc"
            exit 1
          fi
          if readelf --version-info "$addon" 2>/dev/null | grep -q 'GLIBC_'; then
            echo "::error::musl addon contains a GLIBC symbol requirement"
            exit 1
          fi

      - name: Build glibc native addon for the host smoke test
        run: |
          # gnu only feeds the glibc-runner staged-bundle smoke test below;
          # it never enters the Alpine image. The Alpine container wrote
          # root-owned node_modules/target via the bind mount — hand them
          # back to the runner user before the host npm ci.
          sudo chown -R "$(id -u):$(id -g)" native
          cd native && npm ci && npm run build
          test -f codex-tls.linux-x64-gnu.node
          test -f codex-tls.linux-x64-musl.node

      - name: Stage the lite Docker context
        run: |
          node scripts/docker/stage-lite.mjs \
            --out "$RUNNER_TEMP/docker-lite-stage" \
            --package "$RUNNER_TEMP/lite-pkg" \
            --native native

      - name: Smoke test the staged bundle
        run: |
          # The runner is glibc, but the staged tree only carries the musl
          # addon destined for the image. Lend it the gnu addon for this host
          # test only, then drop it so it never reaches the build context.
          STAGE="$RUNNER_TEMP/docker-lite-stage"
          cp native/codex-tls.linux-x64-gnu.node "$STAGE/native/"
          cleanup() { rm -f "$STAGE/native/codex-tls.linux-x64-gnu.node"; }
          trap cleanup EXIT
          # The server must start with only the staged files: no node_modules,
          # sqlite via the node:sqlite builtin.
          cd "$STAGE"
          node app/server.mjs --portable --mode=server --port 18080 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl --noproxy '*' --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              echo "health check passed"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "server did not become healthy"
          kill $SERVER_PID || true
          exit 1

      - name: Assert only the musl addon reaches the image context
        run: |
          test ! -e "$RUNNER_TEMP/docker-lite-stage/native/codex-tls.linux-x64-gnu.node"
          ls -1 "$RUNNER_TEMP/docker-lite-stage/native/"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.version.outputs.tags }}

      - name: Copy Dockerfile.lite into the staged context
        run: cp Dockerfile.lite "$RUNNER_TEMP/docker-lite-stage/Dockerfile"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/docker-lite-stage
          file: ${{ runner.temp }}/docker-lite-stage/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PROXY_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=lite
          cache-to: type=gha,mode=max,scope=lite

      - name: Smoke test the pushed lite image
        run: |
          # Pull the exact image that was just pushed and test it as a user
          # would run it. The host smoke test above uses the gnu addon on
          # glibc and cannot catch a mislinked musl addon — that gap shipped
          # the crash-loop in #805, so verify the real artifact here.
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:sha-${SHORT_SHA}-lite"
          docker pull "$IMAGE"

          # 1. The musl addon must dlopen under the image's own Node.
          docker run --rm "$IMAGE" node -e \
            "require('/app/native/codex-tls.linux-x64-musl.node'); console.log('musl addon loads under alpine node')"

          # 2. Fresh named volumes: entrypoint must seed defaults, server must
          #    start healthy inside the real image.
          docker volume create lite-smoke-config >/dev/null
          docker volume create lite-smoke-data >/dev/null
          cid=$(docker run -d -p 18080:8080 \
            -v lite-smoke-config:/app/config \
            -v lite-smoke-data:/app/data \
            "$IMAGE")
          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
            docker volume rm lite-smoke-config lite-smoke-data >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl --noproxy '*' --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              echo "pushed lite image is healthy"
              docker logs "$cid" | grep -E "Using native \(rustls\)|API key pool" || true
              exit 0
            fi
            sleep 1
          done
          echo "pushed lite image did not become healthy"
          docker logs "$cid"
          exit 1
