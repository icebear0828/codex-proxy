name: Lite package CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # The repository contains AGENTS.md as a symlink. Hosted Windows
      # runners may not enable symlink creation, so materialize it as a file.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.symlinks
      GIT_CONFIG_VALUE_0: ${{ matrix.platform != 'windows' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies
        working-directory: native
        run: npm ci

      - name: Build native addon
        working-directory: native
        run: npm run build

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: lite-ci-native-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}
          path: native/*.node
          if-no-files-found: error
          retention-days: 3

  native-musl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux x64 musl native addon
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/native:/build" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            -w /build \
            ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine \
            sh -lc 'set -eu; apk add --no-cache build-base linux-headers; rustup toolchain install 1.88.0 --profile minimal --no-self-update; rustup target add x86_64-unknown-linux-musl --toolchain 1.88.0; export RUSTUP_TOOLCHAIN=1.88.0; export CC_x86_64_unknown_linux_musl=gcc; export CXX_x86_64_unknown_linux_musl=g++; export AWS_LC_SYS_CC_x86_64_unknown_linux_musl=gcc; export AWS_LC_SYS_CXX_x86_64_unknown_linux_musl=g++; npm ci --include=dev --ignore-scripts --no-audit --no-fund; npm run build:linux-x64-musl; node /scripts/native/test-linux-x64-musl.mjs /build/codex-tls.linux-x64-musl.node'

      - name: Inspect ELF dependencies
        shell: bash
        run: |
          addon="native/codex-tls.linux-x64-musl.node"
          test -f "$addon"
          file_output="$(file "$addon")"
          echo "$file_output"
          echo "$file_output" | grep -Eq 'ELF 64-bit.*x86-64'
          if readelf -d "$addon" | grep -Eq 'libc\.so\.6|ld-linux-x86-64\.so\.2'; then
            echo "::error::musl addon unexpectedly depends on glibc"
            exit 1
          fi
          if readelf --version-info "$addon" 2>/dev/null | grep -q 'GLIBC_'; then
            echo "::error::musl addon contains a GLIBC symbol requirement"
            exit 1
          fi

      - name: Upload native addon
        uses: actions/upload-artifact@v4
        with:
          name: lite-ci-native-linux-x64-musl
          path: native/codex-tls.linux-x64-musl.node
          if-no-files-found: error
          retention-days: 3

  package:
    needs: [native, native-musl]
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.symlinks
      GIT_CONFIG_VALUE_0: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            native/package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install web frontend dependencies
        run: cd web && npm ci

      - name: Download native addons
        uses: actions/download-artifact@v4
        with:
          pattern: lite-ci-native-*
          path: native
          merge-multiple: true

      - name: Build core and shared server bundle
        run: |
          npm run build
          npm --prefix packages/electron run build

      - name: Setup MSYS2 Lite toolchains
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-webview
            mingw-w64-i686-gcc

      - name: Build WebView2 hosts
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP "codex-proxy-webview2"
          New-Item -ItemType Directory -Force -Path $hostDir | Out-Null
          node scripts/portable/build-webview2-host.mjs --arch x86 --out "$hostDir\win-x86\webview2-host.exe"
          node scripts/portable/build-webview2-host.mjs --arch x64 --out "$hostDir\win-x64\webview2-host.exe"

      - name: Download Evergreen WebView2 Bootstrapper
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codex-proxy-webview2\MicrosoftEdgeWebView2Setup.exe"
          node scripts/portable/download-webview2-bootstrapper.mjs --out $path

      - name: Verify Evergreen WebView2 Bootstrapper signature
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codex-proxy-webview2\MicrosoftEdgeWebView2Setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status -ne "Valid") { throw "Invalid WebView2 Bootstrapper signature: $($signature.Status)" }
          if ($signature.SignerCertificate.Subject -notmatch "Microsoft") { throw "Unexpected WebView2 Bootstrapper signer: $($signature.SignerCertificate.Subject)" }

      - name: Build Lite tar.xz
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          PORTABLE_REQUIRE_WINDOWS_EXE: "1"
        run: |
          $hostDir = Join-Path $env:RUNNER_TEMP "codex-proxy-webview2"
          node scripts/portable/build-portable.mjs `
            --webview2-host-x86 "$hostDir\win-x86\webview2-host.exe" `
            --webview2-host-x64 "$hostDir\win-x64\webview2-host.exe" `
            --webview2-bootstrapper "$hostDir\MicrosoftEdgeWebView2Setup.exe"

      - name: Test generated Windows package
        shell: pwsh
        run: |
          $archive = (Get-ChildItem portable-release\*.tar.xz | Select-Object -First 1).FullName
          node scripts/portable/test-portable.mjs --archive $archive --require-windows-exe --require-webview2 --require-linux-x64-musl --test-native-launcher

      - name: Upload Lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-proxy-lite-${{ github.run_number }}
          path: portable-release/*.tar.xz
          if-no-files-found: error
          retention-days: 7

  cross-platform:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            test-args: ""
          - os: macos-latest
            platform: darwin
            test-args: ""
          - os: windows-latest
            platform: win32
            test-args: "--require-windows-exe --require-webview2 --test-native-launcher"

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.symlinks
      GIT_CONFIG_VALUE_0: ${{ matrix.platform != 'win32' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Lite package
        uses: actions/download-artifact@v4
        with:
          name: codex-proxy-lite-${{ github.run_number }}
          path: portable-release

      - name: Test package on ${{ matrix.platform }}
        shell: bash
        run: |
          archive="$(find portable-release -name '*.tar.xz' -print -quit)"
          test -n "$archive"
          node scripts/portable/test-portable.mjs --archive "$archive" ${{ matrix.test-args }}

  musl-smoke:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lite package
        uses: actions/download-artifact@v4
        with:
          name: codex-proxy-lite-${{ github.run_number }}
          path: portable-release

      - name: Extract Lite package
        shell: bash
        run: |
          archive="$(find portable-release -name '*.tar.xz' -print -quit)"
          test -n "$archive"
          package_dir="$RUNNER_TEMP/codex-proxy-lite-musl"
          mkdir -p "$package_dir"
          python3 - "$archive" "$package_dir" <<'PY'
          import sys, tarfile

          with tarfile.open(sys.argv[1], "r:xz") as archive:
              archive.extractall(sys.argv[2])
          PY

      - name: Load musl addon in Alpine Node
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUNNER_TEMP/codex-proxy-lite-musl:/package:ro" \
            -w /workspace \
            ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine \
            node scripts/portable/test-linux-x64-musl.mjs --package-dir /package
